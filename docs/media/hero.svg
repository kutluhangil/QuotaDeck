" fill="#fff" style="animation:tw 2.4s ease-in-out 0.6s infinite"/><circle cx="1118.8" cy="244.6" r="0.7" fill="#fff" style="animation:tw 4s ease-in-out 1.4s infinite"/><circle cx="839.5" cy="114.1" r="1.4" fill="#fff" style="animation:tw 3.2s ease-in-out 1.4s infinite"/><circle cx="1060.7" cy="287.4" r="1.8" fill="#fff" style="animation:tw 3s ease-in-out 1.1s infinite"/><circle cx="688.5" cy="283.8" r="0.9" fill="#fff" style="animation:tw 3.3s ease-in-out 0.7s infinite"/><circle cx="1024" cy="106.3" r="1.2" fill="#fff" style="animation:tw 3.7s ease-in-out 1.9s infinite"/><circle cx="755" cy="158.1" r="0.9" fill="#fff" style="animation:tw 2.8s ease-in-out 2s infinite"/></g>
