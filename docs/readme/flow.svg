    <text x="30" y="8" fill="#e6ebf4" font-size="15" font-weight="600">Byte-offset cursors</text><text x="30" y="27" fill="#8a99b0" font-size="12.5">a quiet minute reads 0 bytes</text></g>
  <g transform="translate(504 270)"><circle class="tick" cx="9" cy="9" r="9" fill="#45c4a0" fill-opacity=".14" style="animation-delay:0.4s"/><path d="M5 9.2l2.8 2.8L13 6.6" fill="none" stroke="#45c4a0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
