<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="t d">
  <title id="t">How Quota Deck works</title>
  <desc id="d">Eight tools write logs on your disk. A read-only Rust core reads only what was appended, deduplicates and buckets it, and feeds the menu bar item, the panel, the dashboard, the macOS widget and the command line. Nothing goes to the network.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#e6ebf4" stroke-opacity="0.035"/></pattern>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#6ba8ff" stop-opacity="0.18"/><stop offset="1" stop-color="#6ba8ff" stop-opacity="0"/></radialGradient>
    <clipPath id="frame"><rect width="1280" height="640" rx="28"/></clipPath>
  </defs>
  <style>
    .ui { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Inter", Helvetica, Arial, sans-serif; }
    .mono { font-family: SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .wire { fill: none; stroke: #2b3a52; stroke-width: 1.5; }
    .flow { fill: none; stroke-width: 1.5; stroke-dasharray: 3 9; animation: flow 1.1s linear infinite; }
    @keyframes flow { to { stroke-dashoffset: -12; } }
    .packet { offset-rotate: 0deg; animation: travel 2.8s cubic-bezier(.45,0,.55,1) infinite; }
    @keyframes travel { 0% { offset-distance: 0%; opacity: 0; } 12% { opacity: 1; } 88% { opacity: 1; } 100% { offset-distance: 100%; opacity: 0; } }
    .breathe { animation: breathe 3.2s ease-in-out infinite; }
    @keyframes breathe { 0%, 100% { stroke-opacity: .35; } 50% { stroke-opacity: 1; } }
    .tick { transform-box: fill-box; transform-origin: center; animation: tick 3.2s ease-in-out infinite; }
    @keyframes tick { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.25); } }
    .deny { animation: deny 2.4s ease-in-out infinite; }
    @keyframes deny { 0%, 100% { opacity: .55; } 50% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .flow, .packet, .breathe, .tick, .deny { animation: none !important; } .packet { display: none; } }
  </style>
