  <g transform="translate(504 332)"><circle class="tick" cx="9" cy="9" r="9" fill="#45c4a0" fill-opacity=".14" style="animation-delay:0.8s"/><path d="M5 9.2l2.8 2.8L13 6.6" fill="none" stroke="#45c4a0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
