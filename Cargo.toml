[workspace]
resolver = "2"
members = ["core", "providers", "app", "cli"]

[workspace.package]
version = "1.0.0"
edition = "2021"
rust-version = "1.82"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
quotadeck-core = { path = "core" }
quotadeck-providers = { path = "providers" }

chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
notify = "8"
redb = "2"
criterion = "0.7"

# Already in the tree through tao and wry; naming them here adds no crate and no bytes.
# `libc` is for the `getpwuid` home lookup the App Sandbox forces, and the objc2 crates are
# for `NSOpenPanel` and security-scoped bookmarks — the only sanctioned way into the real
# home directory from a sandboxed app.
libc = "0.2"
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = [
  "NSArray",
  "NSData",
  "NSError",
  "NSLocale",
  "NSString",
  "NSURL",
] }
objc2-app-kit = { version = "0.3", features = [
  "NSAlert",
  "NSApplication",
  "NSOpenPanel",
  "NSSavePanel",
  "NSWindow",
] }

# No HTTP client is permitted anywhere in this tree. See CLAUDE.md.

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
