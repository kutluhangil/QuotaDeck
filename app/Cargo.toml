[package]
name = "quotadeck-app"
default-run = "quotadeck"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "quotadeck_app"
path = "src/lib.rs"

# The tray application.
[[bin]]
name = "quotadeck"
path = "src/main.rs"

# Mac hardware, Docker and fan readings, and the transparent Liquid Glass popover (Tauri's
# private-API feature). On by default; the parked App Store build (`stores/apple/appstore.sh`)
# builds with `--no-default-features`, so none of it reaches the store.
[features]
default = ["system-monitor"]
system-monitor = ["dep:quotadeck-sysmon", "tauri/macos-private-api"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
quotadeck-core.workspace = true
quotadeck-providers.workspace = true
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
redb.workspace = true

tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-positioner = { version = "2", features = ["tray-icon"] }
tauri-plugin-notification = "2.3.3"
# Opt-in panel hotkey. Registered from Rust only; the panel gets no shortcut permission.
tauri-plugin-global-shortcut = "2"

# The App Sandbox path: `NSOpenPanel` for the one grant the user makes, and security-scoped
# bookmarks to keep it across launches. Both crates are already in the tree through tao and
# wry, so this adds no crate and no measurable binary size.
[target.'cfg(target_os = "macos")'.dependencies]
quotadeck-sysmon = { workspace = true, optional = true }
objc2.workspace = true
objc2-app-kit.workspace = true
objc2-foundation = { workspace = true, features = ["NSString"] }
