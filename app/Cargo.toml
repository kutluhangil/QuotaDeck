[package]
name = "quotadeck-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "quotadeck_app"
path = "src/lib.rs"

# The tray application.
[[bin]]
name = "quotadeck"
path = "src/main.rs"

# Terminal harness for verifying a provider against real logs.
[[bin]]
name = "quotadeck-debug"
path = "src/bin/debug.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
quotadeck-core.workspace = true
quotadeck-providers.workspace = true
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true

tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-positioner = { version = "2", features = ["tray-icon"] }
