[package]
name = "quotadeck-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "quotadeck_app"
path = "src/lib.rs"

# The tray application.
[[bin]]
name = "quotadeck"
path = "src/main.rs"

# Terminal harness for verifying a provider against real logs.
[[bin]]
name = "quotadeck-debug"
path = "src/bin/debug.rs"

# The opt-in Claude Code statusline shim. Runs inside Claude Code, not inside the tray app.
[[bin]]
name = "quotadeck-statusline"
path = "src/bin/statusline.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
quotadeck-core.workspace = true
quotadeck-providers.workspace = true
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true

tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-positioner = { version = "2", features = ["tray-icon"] }
tauri-plugin-notification = "2.3.3"

# The App Sandbox path: `NSOpenPanel` for the one grant the user makes, and security-scoped
# bookmarks to keep it across launches. Both crates are already in the tree through tao and
# wry, so this adds no crate and no measurable binary size.
[target.'cfg(target_os = "macos")'.dependencies]
objc2.workspace = true
objc2-app-kit.workspace = true
objc2-foundation.workspace = true
