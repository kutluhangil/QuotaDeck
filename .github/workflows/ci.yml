name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install
        run: npm ci --prefix ui

      # The panel's fold is a mirror of core/src/horizon.rs and has to be held to it.
      - name: Test
        run: npm test --prefix ui

      - name: Typecheck and build
        run: npm run build --prefix ui

      - name: Upload panel build
        uses: actions/upload-artifact@v4
        with:
          name: ui-dist
          path: ui/dist
          retention-days: 1

  check:
    needs: ui
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2

      # The webview and the tray are system libraries on Linux, so nothing here compiles
      # without them. `libayatana-appindicator3-dev` is the tray: without it the item is not
      # drawn at all on the desktops that use the StatusNotifierItem protocol.
      - name: Linux system dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf

      # The Tauri build embeds the panel, so the Rust crates cannot compile without it.
      - name: Fetch panel build
        uses: actions/download-artifact@v4
        with:
          name: ui-dist
          path: ui/dist

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      # Run on every shipping desktop target. A target-specific HTTP client must fail on the
      # platform where Cargo activates it, not merely on the macOS constraints host.
      - name: No HTTP client dependency
        shell: bash
        run: |
          if cargo tree --workspace | grep -iE 'reqwest|hyper|ureq|isahc|surf|curl'; then
            echo "::error::an HTTP client entered the desktop dependency tree; see CLAUDE.md"
            exit 1
          fi

      # Ignored tests read the developer's own logs and cannot run here.
      - name: Benches compile
        run: cargo bench --workspace --no-run

      # Blueprint §5.5: performance is a feature, so its budget is a merge gate. Release,
      # because a debug build fails these for reasons unrelated to a regression, and
      # single-threaded, because the memory assertion reads a process-wide high-water mark.
      - name: Performance budget
        run: cargo test -p quotadeck-core --release --test perf -- --ignored --test-threads=1 --nocapture

      # The state every App Store user starts in. Signs an ad-hoc bundle with the shipping
      # entitlements and asserts that the real home still resolves and that an installed tool
      # reads as unreachable rather than absent.
      - name: App Sandbox regression
        if: matrix.os == 'macos-latest'
        run: bash scripts/sandbox-check.sh

  # Architectural constraints from CLAUDE.md, enforced rather than trusted.
  constraints:
    runs-on: macos-latest
    needs: ui
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable

      - name: No network entitlement
        run: |
          if grep -rn 'security.network' app/ 2>/dev/null; then
            echo "::error::a network entitlement was added; the privacy claim depends on its absence"
            exit 1
          fi

      - name: Mac App Store configuration uses no private API
        run: node scripts/check-appstore-config.mjs

      - name: App icons match their deterministic source
        run: python3 app/icons/generate.py --check

      - name: No credential or auth-file access
        run: |
          if grep -rniE 'auth\.json|credentials|keychain|oauth|access_token' \
              --include='*.rs' --include='*.toml' core providers app; then
            echo "::error::credential handling is forbidden; see CLAUDE.md"
            exit 1
          fi

      - name: The panel gets no filesystem capability
        run: |
          if grep -riE '"fs:|tauri-plugin-fs' app/capabilities app/Cargo.toml; then
            echo "::error::the frontend must never be granted filesystem access; see CLAUDE.md"
            exit 1
          fi

      # The statusline shim is the single sanctioned write outside our own data directory.
      # Keeping it to one module is what makes that claim checkable.
      - name: Only the shim module touches Claude Code settings
        run: |
          if grep -rn '\.claude/settings\.json' --include='*.rs' core providers app \
              | grep -v '^app/src/statusline.rs:'; then
            echo "::error::settings.json may only be written from app/src/statusline.rs; see CLAUDE.md"
            exit 1
          fi

      # The statusline payload also carries the working directory, the transcript path and the
      # session id. None of it is quota data and none of it may be persisted.
      - name: The shim records no payload field beyond rate limits
        run: |
          if sed '/#\[cfg(test)\]/,$d' app/src/statusline_helper.rs \
              | grep -nE '"(cwd|transcript_path|session_id|workspace|prompt_id|model)"'; then
            echo "::error::the shim must record rate_limits and version only; see docs/DISCOVERY.md §4"
            exit 1
          fi
